# status: HOLDOUT, written before iteration 3 changes (2026-10-29). FROZEN after the commit that adds this file.
# Document: Northmere Wind and Solar plc Annual Report 2025, generated by scripts/make_holdout_pdf.py (a different
# fictional company, UK spelling, one table over two pages, one chart image). The retrieval code is never tuned on
# these questions: they are reported next to the Kirana sets, not used to choose settings.
# Same schema as questions.yaml. Gold chunk ids come from the first ingest of the generated PDF (before any retrieval change).
# Run with: kirana eval --suite holdout --doc <holdout doc_id> --tag holdout_iter2
- id: w01
  type: prose
  question: "What was turnover in 2025 and how much did it grow?"
  expected_answer: "£412 million, up 8.4%"
  must_contain: ["412", "8.4"]
  gold_pages: [2, 3]
  gold_chunks: ["p2-x1", "p3-t1"]
  expected_status: answered
  notes: "Stated in the Chair's statement and in Table 1."
- id: w02
  type: table
  question: "What was operating profit in 2024?"
  expected_answer: "£71 million"
  must_contain: ["71"]
  gold_pages: [3]
  gold_chunks: ["p3-t1"]
  expected_status: answered
  notes: "Single table cell; the year column must be read correctly."
- id: w03
  type: synonym
  question: "What was the group's net debt at the end of 2025?"
  expected_answer: "£312 million (reported as net borrowings)"
  must_contain: ["312"]
  gold_pages: [3]
  gold_chunks: ["p3-t1"]
  expected_status: answered
  notes: "'net debt' vs 'Net borrowings'."
- id: w04
  type: synonym
  question: "Which site can generate the most electricity, and how much?"
  expected_answer: "Dunmere Flats, 410 MW"
  must_contain: ["dunmere flats", "410"]
  gold_pages: [4, 5]
  gold_chunks: ["p4-t1"]
  expected_status: answered
  notes: "Maximum over a 15-row table that spans two pages; 'generate' vs 'Capacity (MW)'."
- id: w05
  type: table
  question: "How much power can the Westerleigh Sands site produce?"
  expected_answer: "276 MW"
  must_contain: ["276"]
  gold_pages: [5]
  gold_chunks: ["p4-t1"]
  expected_status: answered
  notes: "The row sits on the continuation page of Table 2."
- id: w06
  type: figure
  question: "How much electricity did solar generate in 2025?"
  expected_answer: "395 GWh"
  must_contain: ["395"]
  gold_pages: [6]
  gold_chunks: ["p6-f1"]
  expected_status: answered
  notes: "Value is only in the chart image (vision transcript)."
- id: w07
  type: synonym
  question: "Which sites are underperforming enough to trigger a performance review?"
  expected_answer: "Brannock Ridge (91.2%), Fenwick (89.7%) and Greyfell (90.4%) are below 92%. The review needs two consecutive years below 92%; the report gives only 2025."
  must_contain: ["brannock ridge", "fenwick", "greyfell"]
  gold_pages: [4, 5]
  gold_chunks: ["p4-x1", "p4-t1"]
  expected_status: answered
  notes: "Needs the review rule (prose) and the availability column (table). Avoids the words 'availability' and '92%'."
- id: w08
  type: multihop
  question: "By how much did capital investment rise between 2024 and 2025?"
  expected_answer: "£45 million (156 to 201)"
  must_contain: ["45"]
  gold_pages: [3]
  gold_chunks: ["p3-t1"]
  expected_status: answered
  notes: "Subtraction of two table cells."
- id: w09
  type: prose
  question: "How many staff does the company employ?"
  expected_answer: "1,284 colleagues"
  must_contain: ["1284"]
  gold_pages: [2]
  gold_chunks: ["p2-x1"]
  expected_status: answered
  notes: "'staff' vs 'workforce', 'colleagues'; no shared keyword."
- id: w10
  type: crossref
  question: "Did the group meet its lost-time injury target, and by what margin?"
  expected_answer: "Yes: 0.31 against a target of 0.40, 0.09 better"
  must_contain: ["0.31", "0.40"]
  gold_pages: [5]
  gold_chunks: ["p5-x1"]
  expected_status: answered
  notes: "Rate and target are in the same sentence; the margin is arithmetic."
- id: w11
  type: unanswerable
  question: "What connection charge applies at the Fenwick site?"
  expected_answer: "Not given; the report refers to Appendix B, which is not included"
  must_contain: []
  gold_pages: [7]
  expected_status: refused
  notes: "Cross-reference to a missing appendix. Page 7 is a hint only, not evidence."
- id: w12
  type: unanswerable
  question: "What is the operating profit forecast for 2026?"
  expected_answer: "Not given; only turnover growth of 6-8% and capital investment of about £230 million"
  must_contain: []
  gold_pages: [7]
  expected_status: refused
  notes: "Nearby facts exist (outlook) but do not answer the question. Page 7 is a hint only."
- id: w13
  type: false_premise
  question: "Which offshore site will the group acquire in 2026?"
  expected_answer: "None: the report says it does not plan to acquire any offshore site in 2026"
  must_contain: [["no offshore", "not plan to acquire", "does not plan", "none", "no plans"]]
  gold_pages: [7]
  gold_chunks: ["p7-x1"]
  expected_status: answered
  notes: "False premise; the report states the opposite."
