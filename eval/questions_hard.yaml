# DRAFT: needs author review. HARD set, written BEFORE any improvement work, to test what the core set cannot:
# paraphrase and synonyms (no shared keywords with the text), US/UK spelling, conceptual wording, near-duplicate
# rows, evidence spread over several chunks, calculations, and near-miss unanswerable questions.
# Same schema as questions.yaml (see its header). Answers were checked against the PDF text layer and page images.
# Run with: kirana eval --suite hard --tag hard_baseline
- id: h01
  type: synonym
  question: "Which warehouses are underused, below the level that triggers a closure review?"
  expected_answer: "Hat Yai (64%) and Da Nang (62%) are below 65%. Note the watch list needs two consecutive quarters below 65%; the report only gives an annual figure."
  must_contain: ["hat yai", "da nang"]
  gold_pages: [7, 8]
  gold_chunks: ["p7-t1", "p7-x1"]
  expected_status: answered
  notes: "Question avoids the words 'consolidation', 'watch list', 'utilisation', '65%'. Needs table plus threshold."
- id: h02
  type: synonym
  question: "How much did the company invest in capital projects in 2024?"
  expected_answer: "THB 742 million"
  must_contain: ["742"]
  gold_pages: [4]
  gold_chunks: ["p4-t1"]
  expected_status: answered
  notes: "'invest in capital projects' vs 'Capital expenditure'."
- id: h03
  type: synonym
  question: "By how many did the headcount grow between 2024 and 2025?"
  expected_answer: "510 (6,340 to 6,850)"
  must_contain: ["510"]
  gold_pages: [10]
  gold_chunks: ["p10-t1"]
  expected_status: answered
  notes: "'headcount' vs 'Employees'; needs subtraction of table totals."
