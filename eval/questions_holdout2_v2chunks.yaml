# status: HOLDOUT2, written before the current code was run on the document (2026-10-29). FROZEN after the commit that adds this file.
# Document: Halbrook Regional Health Group Annual Report 2025 (a fictional hospital group), 30 pages, generated by
# scripts/make_holdout2_pdf.py. Two-column prose, notes to the accounts, footnotes, glossary, a table over three pages, a table
# with merged header cells, a table without ruling lines, two charts, one scanned page, one landscape page, UK and US spelling,
# 1,234.5 and 1.234,5 number formats. Nothing is tuned on these questions; they are reported next to the other three sets.
# Same schema as questions.yaml, with one addition:
#   gold_text:  verbatim strings (pipes and extra whitespace are ignored when matching) that mark the chunks holding the
#               evidence. gold_chunks is filled in mechanically by scripts/resolve_gold_chunks.py after the first ingest: every
#               chunk whose text contains any of these strings is gold. A string that no chunk contains is an ingestion loss
#               (listed in the failure analysis); gold_chunks is then left out and the question counts only at the answer level.
#               Chunk ids are never chosen by looking at retrieval or answers.
# gold_chunks were added in the commit after this file was frozen, by the script, from the first ingest (no run had happened yet).
# Run with: kirana eval --suite holdout2 --doc <holdout2 doc_id> --tag holdout2_baseline
