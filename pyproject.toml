[project]
name = "kirana-rag"
version = "0.1.0"
description = "Document intelligence over annual-report PDFs: ingest, ask, eval."
requires-python = ">=3.12"
dependencies = [
    "pymupdf",
    "httpx",
    "rank-bm25",
    "typer",
    "pyyaml",
    "python-dotenv",
    "rich",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[project.scripts]
kirana = "kirana_rag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kirana_rag"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
